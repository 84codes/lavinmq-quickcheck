[package]
name = "amqp-quickcheck"
version = "0.1.0"
edition = "2024"

[dependencies]
quickcheck = "1"
lapin = "2"

[dev-dependencies]
quickcheck_macros = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-lite = "2"
ureq = { version = "3.4.2", default-features = false }
